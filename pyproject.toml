[project]
name = "sparc"
version = "0.2.0"
description = "Unofficial fork of Speech Articulatory Coding (SPARC), modernized for Python 3.13+ and uv"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=0.36.0",
    "hydra-core>=1.3.4",
    "ipykernel>=7.1.0",
    "jiwer>=4.0.0",
    "librosa>=0.11.0",
    "lightning>=2.6.5",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.2",
    "pesq>=0.0.4",
    "pyarrow>=17",
    "pysptk>=1.0.1",
    "soundfile>=0.13.1",
    "speechbrain>=1.1.1",
    "tensorboard>=2.21.0",
    "torch>=2.9.0",
    "torchcrepe>=0.0.24",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "vocos>=0.1.0",
    "wandb>=0.28.1",
]

[project.urls]
Repository = "https://github.com/nzxyin/Speech-Articulatory-Coding"
Upstream = "https://github.com/Berkeley-Speech-Group/Speech-Articulatory-Coding"

[project.scripts]
sparc-encode = "sparc.cli.encode:main"
sparc-decode = "sparc.cli.decode:main"
sparc-train = "sparc.cli.train:main"
sparc-cache = "sparc.cli.cache_features:main"
sparc-predict = "sparc.cli.predict_vocoder:main"
sparc-eval = "sparc.cli.eval_vocoder:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
markers = [
    "slow: downloads or runs real models or the SPARC extractor (deselect with -m \"not slow\")",
]
