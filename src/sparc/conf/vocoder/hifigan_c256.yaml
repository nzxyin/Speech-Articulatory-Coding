# HiFi-GAN generator, size variant: identical to hifigan.yaml except channels=256.
name: hifigan_c256
generator:
  _target_: sparc.vocoders.models.hifigan.HiFiGANVocoder
  in_channels: 15
  channels: 256
  upsample_scales: [8, 5, 4, 3]
  upsample_kernel_sizes: [16, 10, 8, 6]
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilations: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
  spk_dim: 64
  pitch_mode: log
  voiced_flag: false
  kernel_size: 7
  negative_slope: 0.1
  output_negative_slope: 0.01
