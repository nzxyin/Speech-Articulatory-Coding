# DDSP24 (primary): 50 Hz dilated residual trunk, learned upsampler to a 200 Hz control rate, 100-harmonic sin/cos
# bank plus 129-band filtered noise, 1537-tap post filter; about 5.92 M parameters (Phase 1 report, section 6).
name: ddsp
generator:
  _target_: sparc.vocoders.models.ddsp.DDSPVocoder
  channels: 256
  n_harmonics: 100
  n_noise_bands: 129
  control_rate: 200
  noise_gain_cap: 0.25
  post_filter_taps: 1537
  f0_anchor_offset: 120
  spk_dim: 64
  trunk_stacks: 2
  trunk_dilations: [1, 2, 4, 8]
  up_channels: [192, 128]
  head_hidden: 512
  periodicity_gate: false
  loudness_film: true
  head_film: true
  noise_bias_init: -3.0
  taper_hz: 1000.0
  pitch_mode: log
  voiced_flag: false
