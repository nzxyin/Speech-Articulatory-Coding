# Single GPU, fp32, progress bar on: overfitting a handful of utterances to check that the pipeline can learn.
trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  strategy: auto
  precision: 32-true
  deterministic: false
  benchmark: false
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  limit_val_batches: 0
  enable_progress_bar: true
  enable_model_summary: true
logging:
  backends: [tensorboard]
  wandb_mode: offline
  wandb_project: sparc-vocoders
