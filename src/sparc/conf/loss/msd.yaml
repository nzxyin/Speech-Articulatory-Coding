# Shared recipe with the multi-scale discriminator in place of the multi-resolution one (discriminator-domain
# ablation, decision D10). The MRD's 0.1 weights were tuned for a spectrogram-domain discriminator; the waveform-domain
# MSD takes the MPD's weights (1.0 adversarial, 1.0 feature matching), as in HiFi-GAN.
name: msd
adversarial: hinge
mel_weight: 45.0
mss_weight: 0.0
mel:
  _target_: sparc.vocoders.losses.losses.MelSpectrogramLoss
  sample_rate: 24000
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  n_mels: 100
  f_min: 0.0
  f_max: 12000.0
  power: 1.0
  center: true
  mel_scale: htk
  clamp: 1.0e-5
mss:
  _target_: sparc.vocoders.losses.losses.MultiScaleSpectralLoss
  fft_sizes: [2048, 1024, 512, 256, 128, 64]
  hop_ratio: 0.25
  alpha: 1.0
discriminators:
  mpd:
    module:
      _target_: sparc.vocoders.losses.discriminators.MultiPeriodDiscriminator
      periods: [2, 3, 5, 7, 11]
    adv_weight: 1.0
    fm_weight: 1.0
  msd:
    module:
      _target_: sparc.vocoders.losses.discriminators.MultiScaleDiscriminator
      scales: [1, 2, 4]
    adv_weight: 1.0
    fm_weight: 1.0
