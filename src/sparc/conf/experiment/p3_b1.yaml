# @package _global_
# Speaker-embedding Phase 3 screening arm B1: l6 FFN, 1-3 references from other utterances (p_cross 1).
# Recipe otherwise experiment=ablation_100k (100k generator steps, 16 x 64-frame crops).
experiment_name: p3_b1
train:
  max_g_steps: 100000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
speaker:
  type: ffn
  layer: l6
  p_cross: 1.0
  n_refs: [1, 3]
