# @package _global_
# Speaker-embedding Phase 4 screen arm S: swap-in-training. 25% of each batch (after the mel warm-up) is decoded with
# another speaker's code and its voiced F0 scaled by the speakers' median-F0 ratio; adversarial loss only.
# Needs the per-speaker F0 file: python -m sparc.vocoders.data.dataset f0-stats
# Recipe otherwise B0 = experiment=ablation_100k (100k generator steps, 16 x 64-frame crops, l6 FFN, p_cross 0.5).
experiment_name: p4_s
train:
  max_g_steps: 100000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
speaker:
  type: ffn
  layer: l6
  p_cross: 0.5
  swap:
    p: 0.25
