# @package _global_
# Speaker-embedding Phase 3 finalist B2 at the primary recipe, second training seed (see p3_b2_main and main_seed1).
experiment_name: p3_b2_main_seed1
seed: 1
train:
  max_g_steps: 400000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
speaker:
  type: layerpool
  layer: layers
  layer_stats_root: ${oc.env:SPKEMB_P3_CACHE}
  p_cross: 1.0
  n_refs: [1, 3]
