# @package _global_
# Speaker-embedding Phase 4 combination M + R-F0 + G at the primary recipe, second training seed (see p4_mrg_main).
# Baseline: experiment main_seed1 (B0 at 400k, seed 1).
experiment_name: p4_mrg_main_seed1
seed: 1
train:
  max_g_steps: 400000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
  train_splits:
    - train.clean.100
    - train.clean.360
    - train.other.500
    - /data/user_data/xoy/spkemb/phase4/globe_train/packed/globe.train
speaker:
  type: ffn
  layer: l6
  p_cross: 0.5
  n_refs: [1, 8]
  rel_f0:
    enabled: true
vocoder:
  generator:
    pitch_mode: log_relative
