# @package _global_
# Ablation runs (decision D10, and the Vocos option that lost the A/B pilot): 100k generator steps, otherwise the main
# recipe. Ablations that change the loss or the speaker protocol need their own experiment name (the run directory is
# keyed by experiment and vocoder name only).
experiment_name: ablation_100k
train:
  max_g_steps: 100000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
