# @package _global_
# Filtered LibriTTS-R + filtered GLOBE v3 + filtered VCTK (Phase 5 arm fv) at the primary recipe: 400k generator steps,
# seed 0 (user decision 2026-11-01). Same as p5_fv except max_g_steps. Paired baselines (seed 0): p4_mrg_main
# (unfiltered LibriTTS-R + GLOBE, no VCTK, same recipe) and main (existing speaker network).
experiment_name: p5_fv_main
seed: 0
train:
  max_g_steps: 400000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
  train_splits:
    - /data/user_data/xoy/spkemb/phase5/packed/libritts_f/train.clean.100
    - /data/user_data/xoy/spkemb/phase5/packed/libritts_f/train.clean.360
    - /data/user_data/xoy/spkemb/phase5/packed/libritts_f/train.other.500
    - /data/user_data/xoy/spkemb/phase5/packed/globe_f/globe.train
    - /data/user_data/xoy/spkemb/phase5/packed/vctk.train
speaker:
  type: ffn
  layer: l6
  p_cross: 0.5
  n_refs: [1, 8]
  rel_f0:
    enabled: true
vocoder:
  generator:
    pitch_mode: log_relative
