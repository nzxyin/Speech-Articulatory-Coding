# @package _global_
# Speaker-embedding Phase 4 screen arm M: up to 8 references per training crop (k ~ U{1..8}, each cross-utterance with
# p_cross 0.5, averaged by the FFN); evaluated with K = 5 references.
# Recipe otherwise B0 = experiment=ablation_100k (100k generator steps, 16 x 64-frame crops, l6 FFN, p_cross 0.5).
experiment_name: p4_m
train:
  max_g_steps: 100000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
speaker:
  type: ffn
  layer: l6
  p_cross: 0.5
  n_refs: [1, 8]
