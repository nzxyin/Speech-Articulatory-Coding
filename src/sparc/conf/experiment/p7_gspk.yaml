# @package _global_
# Speaker-embedding Phase 7, arm gspk: experiment p5_fv (filtered LibriTTS-R + filtered GLOBE v3 + filtered VCTK, Phase 4
# combination recipe, HiFi-GAN, 100k generator steps, seed 0) with real speaker labels for GLOBE: only the GLOBE split
# path differs (same rows and features, `speaker` = Common Voice contributor), so GLOBE references are other utterances of
# the same speaker. Pre-registration: docs/spkemb_phase7_globe_speakers.md.
# Data: python -m sparc.vocoders.features.globe_speakers ids|pack
experiment_name: p7_gspk
seed: 0
train:
  max_g_steps: 100000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
  train_splits:
    - /data/user_data/xoy/spkemb/phase5/packed/libritts_f/train.clean.100
    - /data/user_data/xoy/spkemb/phase5/packed/libritts_f/train.clean.360
    - /data/user_data/xoy/spkemb/phase5/packed/libritts_f/train.other.500
    - /data/user_data/xoy/spkemb/phase7/packed/globe_f_spk/globe.train
    - /data/user_data/xoy/spkemb/phase5/packed/vctk.train
speaker:
  type: ffn
  layer: l6
  p_cross: 0.5
  n_refs: [1, 8]
  rel_f0:
    enabled: true
vocoder:
  generator:
    pitch_mode: log_relative
