# @package _global_
# Binary voicing gate (docs/vocoder_periodicity_analysis.md, "Binary voicing gate"): the vocoder comparison's 100k HiFi-GAN
# reference recipe (experiment ablation_100k) with the continuous periodicity channel of the generator input replaced by
# the 0/1 voicing flag 1[periodicity > 0] (the extractor's own voiced / unvoiced decision, CREPE periodicity >= 0.4; see
# VOICING_THRESHOLD in models/frontend.py). The network input stays 15 channels in the reference order (12 EMA, pitch,
# loudness, voicing). Same data, speaker network (periodicity-weighted pooling kept), losses, discriminators, schedule and
# seed as the reference; only the value of the 15th input channel differs (compare periodicity_none_100k, which removes it).
# Seed 1: the pre-registered second gate seed for a borderline result (same rule on the mean of the two gate seeds).
experiment_name: periodicity_binary_100k_seed1
seed: 1
train:
  max_g_steps: 100000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
vocoder:
  generator:
    binary_periodicity: true
