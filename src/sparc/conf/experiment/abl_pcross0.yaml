# @package _global_
# Ablation (decision D10): speaker references always from the target utterance itself (p_cross = 0, the fork's
# protocol), 100k generator steps; compare with experiment=ablation_100k for the same vocoder.
experiment_name: abl_pcross0
train:
  max_g_steps: 100000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
speaker:
  p_cross: 0.0
