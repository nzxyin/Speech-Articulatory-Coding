# @package _global_
# Speaker-embedding Phase 3 finalist: arm B2 (layer pool over all 25 WavLM layers, mean + std, deterministic, 1-3
# other-utterance references) with the primary recipe (experiment=main: 400k generator steps, 16 x 64-frame crops),
# seed 0. Compare with experiment=main / main_seed1 (shipped l6 FFN definition) of the vocoder comparison.
experiment_name: p3_b2_main
seed: 0
train:
  max_g_steps: 400000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  milestone_every_g_steps: 50000
data:
  batch_size: 16
  crop_frames: 64
speaker:
  type: layerpool
  layer: layers
  layer_stats_root: ${oc.env:SPKEMB_P3_CACHE}
  p_cross: 1.0
  n_refs: [1, 3]
