# Root config of the 24 kHz vocoder comparison (`uv run sparc-train vocoder=<name> experiment=<name>`).
# See docs/vocoders/INTERFACES.md. `_self_` comes before `experiment` so that an experiment overrides the values below.
defaults:
  - paths: default
  - vocoder: hifigan
  - data: librittsr_filtered
  - loss: shared
  - trainer: default
  - _self_
  - experiment: null

experiment_name: default
seed: 0
stats_path: ${paths.cache_root}/stats/train_stats.json
run_dir: ${paths.runs_root}/${experiment_name}/${vocoder.name}
resume: auto     # auto: newest loadable ${run_dir}/ckpt/step*.ckpt, else a fresh start; none: always start fresh

optim:
  lr: 2.0e-4
  betas: [0.8, 0.9]
  weight_decay: 0.01
  warmup_steps: 1000

train:
  max_g_steps: 400000
  mel_warmup_steps: 10000
  val_every_g_steps: 5000
  log_every_g_steps: 50
  milestone_every_g_steps: 50000
  checkpoint_every_minutes: 20
  keep_last_checkpoints: 3

speaker:
  layer: l6        # l6 (en+ layer, decision D5) or l0
  p_cross: 0.5     # probability of a cross-utterance reference in training (decision D4)
  dropout: 0.2
  # Speaker-embedding Phase 3 (docs: speaker_embedding_plan.md on branch multispeaker-eval); defaults keep the FFN above.
  type: ffn               # ffn | layerpool (all-layer statistics; needs layer: layers and layer_stats_root)
  n_refs: null            # [lo, hi]: k ~ U{lo..hi} references per training crop; evaluation T3 then uses the whole pool
  layer_stats_root: null  # cache of sparc.vocoders.features.spk_layers (<split>/{mean,std}.npy, stats.npz)
  hidden_dim: 1024
  use_std: true
  vae:
    enabled: false
    capacity_max: 32.0    # nats; loss gamma * |KL - C|, C ramped linearly from 0 over capacity_steps generator steps
    capacity_steps: 50000
    gamma: 1.0
  tc:
    weight: 0.0           # beta-TC penalty on a side batch of single-reference posteriors
    pool_size: 8192       # random training references held on the GPU for the side batch
    batch: 256
  mix:
    p: 0.0                # fraction of each batch decoded from a mixed or prior code (adversarial loss only)
    prior_frac: 0.5       # of those, the fraction drawn from N(0, I); the rest interpolate two batch speakers
    cycle_weight: 0.0     # latent cycle through frozen WavLM on the crops

predict:           # `sparc-predict`: the split and conditions come from data.predict_split / data.predict_conditions
  ckpt: null       # null: newest loadable checkpoint of the run
  output_dir: ${run_dir}/predictions
  precision: 32-true
  skip_existing: false   # true: leave out utterances whose WAV exists (resumable synthesis; the evaluation sets it)

hydra:
  run:
    dir: ${run_dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
