# Root config of the Phase 3 evaluation (`sparc-eval stage=<...> system=<name|all> condition=<T1|T2|T3|all>`).
# Contract: docs/vocoders/EVALUATION.md. Metric settings come from the group `eval_metrics`, feature and probe settings
# from `eval_features`; this file holds the run selection, the system registry and the aggregation settings.
defaults:
  - paths: default
  - data: librittsr_filtered
  - eval_metrics: default
  - eval_features: default
  - _self_
  - eval_systems: main     # the system registry (name -> spec); eval_systems=ablations selects the ablation systems

# stage: gt | synth | refs | signal | utmos | asr | spk | reextract | prosody | probes | efficiency | aggregate | samples
stage: ???
system: all          # a name of eval.systems, or all (every system the stage applies to)
condition: all       # T1 | T2 | T3 | all (every condition of the system)
seed: 0
stats_path: ${paths.cache_root}/stats/train_stats.json

paths:
  eval_root: ${oc.env:SV_ROOT}/eval

eval:
  split: test.clean
  table_name: main         # main: tables/<split>/ (as before); any other name writes tables/<split>/<name>/ (and samples_<name>/)
  limit: null              # N: a fixed random subset of N ids, written under eval_root/smoke_<N>/ (never mixed with full results)
  seed: ${seed}            # seed of the limit subset (the same draw as data.predict_limit) and of the samples
  chunk_size: 256          # utterances per chunk of the sorted id list; chunk k writes part-<k:04d>
  device: auto             # auto: cuda when available, else cpu
  allow_fingerprint_change: false   # true: a vocoder checkpoint change may reuse an existing result directory (default: error)
  sex_file: ${paths.eval_root}/ref_data/LibriTTS_R/SPEAKERS.txt   # LibriTTS-R doc.tar.gz (speaker -> F/M), read by io.read_speaker_sex
  gain_db: ${data.eval_gain_db}   # level of the gt audio and of the vocoder inputs (-3 dBFS peak)
  max_audio_failures: 10   # refs stage: utterances a reference model may fail on (per system and condition) before the stage stops
  require_final: true      # refuse a vocoder checkpoint that has not reached train.max_g_steps (false for smoke runs)
  spk_models: [ecapa, wavlm_sv]   # speaker embedders of the spk stage (the first is the primary model of sim_same/sim_spk)
  predict:
    num_workers: 2
    precision: 32-true
  samples:
    n_female: 10
    n_male: 10
    duration_range_s: [3.0, 12.0]
    seed: 0
    pcm_subtype: PCM_16
  aggregate:
    n_boot: 10000
    seed: 0
    ci: 0.95
    split_chapters: true   # T2 reported also stratified by same / different chapter
    reference_systems: [vocos_mel, enplus16]   # every vocoder is also compared with these on shared ids
    pairs: null            # null: every pair of vocoders; else a list of [system a, system b] (a - b, under their shared conditions)
    note: >-
      Each arm is a single training run: differences between vocoders include run-to-run variance that this table
      cannot separate from an architecture effect. Intervals are speaker-cluster bootstrap CI95 over test speakers.

hydra:
  run:
    dir: ${paths.eval_root}/hydra/${stage}_${now:%Y%m%d-%H%M%S}
  output_subdir: null
  job:
    chdir: false
